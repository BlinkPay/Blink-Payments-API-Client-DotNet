name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_test_sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes back to the repo, so don't leave the token in .git/config
          persist-credentials: false
          # Full history so SonarCloud can attribute new code accurately
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both SDKs: the 10.0 SDK builds every target framework, the 8.0 runtime runs the net8.0 tests
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Restore NuGet packages
        run: dotnet restore --locked-mode
      - name: Begin Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin /k:"blink-debit-api-client-dotnet" /o:"blinkpay" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
        continue-on-error: true
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:WarningLevel=0
      - name: Test
        # Reuses the Release output above, so coverage is measured against the binaries Sonar analysed.
        # Runs once per target framework (net8.0 and net10.0). global.json opts `dotnet test` into
        # Microsoft.Testing.Platform, so coverage comes from Microsoft.Testing.Extensions.CodeCoverage
        # as Visual Studio coverage XML, one file per test assembly per framework under TestResults/.
        run: dotnet test --configuration Release --no-build --verbosity normal --coverage --coverage-output-format xml /p:WarningLevel=0
        env:
          BLINKPAY_CLIENT_ID: ${{ vars.CLIENT_ID }}
          BLINKPAY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          # Microsoft.Testing.Platform telemetry is opt-out
          TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      - name: End Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        continue-on-error: true
      - name: Convert coverage to LCOV for Aikido
        # Aikido reads LCOV or Cobertura, not Visual Studio coverage XML. ReportGenerator merges
        # the per-assembly, per-framework files into one report.
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:TestResults/*.xml -targetdir:coverage -reporttypes:lcov
      - name: Store the LCOV report for the Aikido upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1

  # Aikido's PR check waits 30 minutes for a report tied to the PR head commit,
  # which the action reads from the event payload. Kept as its own job so the
  # OIDC token grant stays off the test job, as Aikido recommends. Fork PRs
  # cannot mint an OIDC token, so they are skipped.
  aikido-coverage:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    needs: build_test_sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the LCOV report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@e0637ab96a560c1ab11671c41a4a4668075bae0e # v2.1.1
        with:
          region: au
          file-paths: coverage/lcov.info
