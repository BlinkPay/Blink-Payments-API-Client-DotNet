name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  nuget_push:
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'master'
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job pushes back to the repo, so don't leave the token in .git/config
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both SDKs: the 10.0 SDK builds every target framework, the 8.0 targeting pack covers net8.0
          dotnet-version: |
            8.0.x
            10.0.x
          source-url: https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}
      - name: Pack
        run: |
          dotnet restore --locked-mode
          dotnet pack --configuration Release /p:PackageVersion=${{ github.event.release.tag_name }}
      - name: Push
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run:
          dotnet nuget push "**/*.nupkg" --api-key "$NUGET_TOKEN"
